name: test

on:
  # `main` only on push. Without the filter every branch runs this *and* the
  # image build, and a pull request from a branch in this repository runs both
  # twice -- once for the push, once for the PR.
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. The default GITHUB_TOKEN permissions follow a
# repository setting that can be write, and a workflow should not inherit more
# than it uses.
permissions:
  contents: read

# A second push supersedes the first; the run it interrupts was going to be
# thrown away anyway.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the `engines` floor -- `npm test` runs TypeScript through
        # Node's own type stripping, unflagged only from there. 24 is the
        # newest, where stripping behaviour moves next.
        node-version: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
