name: image

# The image has been built and run in production by hand, and CLAUDE.md names
# that gap explicitly: "there is still no CI building it, so a Dockerfile
# change is verified by hand or not at all." This workflow closes it.
#
# Building the image only proves it builds. Each step below uses the result
# for something the image is actually for, so a broken entrypoint, a broken
# `--dry-run`, or a build that is not byte-identical to its own goldens fails
# here instead of on a host nobody is watching.
#
# The image is never pushed anywhere -- distribution is a roadmap decision,
# not a CI one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This one builds a whole image, so a superseded run is worth cancelling
# rather than leaving to finish.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The clean-room check below runs test/dump-db.ts on the runner itself,
      # not inside the image, and that needs a Node new enough for two things:
      # `node:sqlite` (22.5+) and running TypeScript through its own type
      # stripping, unflagged (22.18+). The runner's preinstalled Node is
      # whatever the image ships and is not a version this repository chose.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: build the image
        run: docker build -t gamereg:ci .

      - name: gamereg --version runs
        run: docker run --rm gamereg:ci gamereg --version

      - name: entrypoint --dry-run performs nothing
        run: |
          set -eu
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/vault" "$scratch/config"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TELEGRAM_BOT_TOKEN=ci-token \
            -e TELEGRAM_ALLOW_FROM=4242 \
            -v "$scratch/vault:/vault" \
            -v "$scratch/config:/config" \
            gamereg:ci gamereg-entrypoint gateway --dry-run

      - name: clean-room build matches the committed goldens
        run: |
          set -eu
          scratch="$(mktemp -d)"
          cp -r example-vault/. "$scratch/"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$scratch:/vault" \
            gamereg:ci gamereg build --vault /vault
          # .gamereg/ is build bookkeeping (the manifest and the build lock) --
          # gitignored, and test/golden.test.ts excludes it from the golden
          # comparison for the same reason: it is not a fixture.
          rm -rf "$scratch/.gamereg"
          # log.db is compared logically, not byte for byte: SQLite's on-disk
          # layout is not stable across library versions, so a fixture
          # committed from one build can differ in bytes from another with no
          # difference in what the database actually says (CLAUDE.md,
          # test/helpers.ts's dumpDatabase). Every other artifact is text this
          # project writes itself and stays byte for byte.
          # test/dump-db.ts, which is a shell over the same dumpDatabase()
          # test/golden.test.ts compares with. Not a second implementation:
          # this check and that test have to agree by construction, and a
          # standalone copy of the dump logic was already silently wrong about
          # blobs, bigints and NULL before it was removed.
          node --no-warnings test/dump-db.ts example-vault/data/log.db > /tmp/log.db.golden.sql
          node --no-warnings test/dump-db.ts "$scratch/data/log.db" > /tmp/log.db.built.sql
          diff /tmp/log.db.golden.sql /tmp/log.db.built.sql
          # A different runner every time is stronger evidence for
          # non-negotiable 2 (idempotent, byte-identical output) than any one
          # developer's own machine can produce -- this was previously only
          # ever checked by hand, once, on one libc and one install path.
          diff -rq --exclude=log.db --exclude=.gamereg example-vault "$scratch"
