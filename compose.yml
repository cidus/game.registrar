# The Registrar, as an installation (06-roadmap.md, phase 4).
#
# This file is hand-written now and generated later: phase 4's own bullet says
# the generator "emits the declarative configuration -- compose file and
# environment -- and never becomes part of the runtime". This is that artifact.
#
# Sized for the smallest machine anyone will actually use: a GCP always-free
# e2-micro, which is 1 GB of RAM and 1 GB of egress a month. Both numbers
# decide something here, and docs/deploy-container.md explains which.
#
#   docker compose up -d                      register and agent
#   docker compose --profile site up -d       ... and a locally built site
#   docker compose --profile comments up -d   ... and comments
#   docker compose --profile tunnel up -d     ... reachable from outside
#
# The profiles compose, because the questions are independent:
#
#   site here, comments here      --profile site --profile comments
#   site on Cloudflare, comments here    --profile comments --profile tunnel
#   both public                   all three
#
# The two profiles are off by default and stay off on an e2-micro. See the
# runbook before turning either on.

name: gamereg

x-gamereg:
  # Read by the generator when it later regenerates this file, so it can tell
  # what produced the version on disk and whether the schema has moved. `x-`
  # keys are Compose's own extension mechanism: ignored by Docker, ours to use.
  schema: 1
  generated_by: hand

x-image: &image
  image: gamereg:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: unless-stopped

services:
  # The gateway. Long-lived, holds the compiled system prompt and every open
  # session, and is the only service a person talks to.
  gateway:
    <<: *image
    container_name: gamereg-gateway
    command: ["gateway"]
    volumes:
      - ${GAMEREG_VAULT_PATH:-./vault}:/vault
      - ${GAMEREG_CONFIG_PATH:-./config}:/config
    # Telegram is long-polled, so nothing needs to reach in: no ports, no
    # firewall rule, no public address. That is worth keeping true.
    # A TCP connect, and nothing heavier, for a reason that took a real
    # e2-micro to find. `openclaw gateway health` is a whole Node process: 0.4s
    # on a laptop, minutes on a shared 0.25 vCPU under memory pressure. Longer
    # than the interval, so the checks piled up, and a dozen Node processes
    # competing pushed the load average past 30 and starved the very boot they
    # were waiting on. The health check became the outage.
    #
    # bash's /dev/tcp spawns nothing, and it answers the only question
    # `provision` actually asks: is the gateway listening. Whether it will
    # accept an authenticated RPC yet is provision's own business, and it
    # retries.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${OPENCLAW_GATEWAY_PORT:-18789}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: ${GATEWAY_START_PERIOD:-300s}
    mem_limit: ${GATEWAY_MEM_LIMIT:-480m}

  # One shot, then gone. `openclaw cron add` is a Gateway *client* command --
  # it connects over the WebSocket -- so the check-in job cannot be registered
  # by the gateway's own entrypoint, before the gateway exists. Hence a service
  # that waits for the health check above and then registers it, idempotently.
  provision:
    <<: *image
    container_name: gamereg-provision
    command: ["provision"]
    restart: on-failure:5
    # Share the gateway's network stack, so 127.0.0.1 here *is* the gateway.
    # The alternative -- reaching it as ws://gateway:18789 over the compose
    # network -- is refused outright, and rightly: "plaintext ws:// to a
    # non-loopback address. Both credentials and chat data would be exposed."
    # Giving two containers one loopback is cheaper than terminating TLS
    # between them, and keeps the gateway unreachable from anywhere else.
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ${GAMEREG_VAULT_PATH:-./vault}:/vault
      - ${GAMEREG_CONFIG_PATH:-./config}:/config

  # enrich, build, commit, push -- on an interval. Replaces the systemd timer,
  # which has no meaning here. Same image as the gateway because the agent's
  # boundary requires `gamereg` to be a local binary, and this needs the same
  # binary.
  maintenance:
    <<: *image
    container_name: gamereg-maintenance
    command: ["maintenance"]
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ${GAMEREG_VAULT_PATH:-./vault}:/vault
      - ${GAMEREG_CONFIG_PATH:-./config}:/config
      # The deploy key for the vault's push, read-only. Never baked into the
      # image and never in the repository.
      - ${GAMEREG_SSH_PATH:-./config/ssh}:/config/ssh:ro
    mem_limit: ${MAINTENANCE_MEM_LIMIT:-256m}

  # --- profile: site ---------------------------------------------------------
  #
  # Off by default, and it should stay off on a 1 GB machine: a Quartz build
  # peaks at 400-700 MB against a gateway already holding 250-400, and this
  # machine's monthly egress is smaller than a few crawls of a vault's cover
  # art. The default topology builds the site from the repository the
  # maintenance loop already pushes, which costs this machine nothing.
  #
  # It is built anyway because an installation with no external account still
  # needs a page, and because the shape -- something builds, something static
  # serves -- is the one a future Astro target reuses unchanged.
  # The same image as the gateway, not a second one. It is already built on
  # node:22-bookworm-slim, so node, npm and npx are all there -- and mounting
  # the loop script from ./docker instead only ever worked in a checkout. On a
  # machine holding just compose.yml and .env, Docker created an empty
  # directory at that path and the container crash-looped on "Permission
  # denied", which names the symptom and not the cause.
  site-build:
    <<: *image
    container_name: gamereg-site-build
    profiles: [site]
    command: ["site"]
    environment:
      # The image sets HOME=/config so git and the gateway agree on one place,
      # and this service does not mount /config -- npm then has nowhere to put
      # its cache and dies on "Log files were not written". Its own HOME on a
      # volume also means the npm cache survives a rebuild, which is the
      # difference between a slow first install and a slow every install.
      HOME: /cache
    volumes:
      - ${GAMEREG_VAULT_PATH:-./vault}:/vault
      - ${GAMEREG_SITE_PATH:-./site}:/site
      - ${GAMEREG_SITE_CACHE_PATH:-./cache}:/cache
    mem_limit: ${SITE_BUILD_MEM_LIMIT:-768m}

  site-serve:
    image: caddy:2-alpine
    container_name: gamereg-site-serve
    profiles: [site]
    restart: unless-stopped
    # The config comes from the shared directory, written by site-build, rather
    # than mounted from ./docker -- a path that exists in a checkout and
    # nowhere else.
    command: ["caddy", "run", "--config", "/site/Caddyfile", "--adapter", "caddyfile"]
    depends_on: [site-build]
    volumes:
      - ${GAMEREG_SITE_PATH:-./site}:/site:ro
    ports:
      - "${SITE_BIND:-127.0.0.1}:${SITE_PORT:-8080}:8080"
    mem_limit: 64m

  # --- profile: comments -----------------------------------------------------
  #
  # Remark42 is the one piece here with a genuinely ready upstream image: a Go
  # binary with an embedded BoltDB, so no database service and roughly 30 MB
  # resident. That is affordable on this machine in a way a Quartz build is not.
  #
  # It always runs *here*, because it is stateful. What changes is how a browser
  # reaches it, and that is a separate decision -- hence a separate `tunnel`
  # profile below. Bundling the two meant the `site` profile, which exists
  # precisely for an installation with no external account, could not have
  # comments at all without opening a Cloudflare account for them.
  remark42:
    image: ghcr.io/umputun/remark42:latest
    container_name: gamereg-remark42
    profiles: [comments]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # The public address the browser will reach, which is the tunnel's
      # hostname and not this container's.
      #
      # Empty defaults rather than `${VAR:?}`, which reads like the better
      # error message and is not: Compose interpolates the whole file before
      # it filters by profile, so one required variable in an opt-in service
      # breaks every command for everyone who never enables it -- `up`
      # included. Remark42 reports its own missing configuration at start,
      # which is late but only reaches the person who asked for it.
      REMARK_URL: ${REMARK_URL:-}
      SECRET: ${REMARK_SECRET:-}
      SITE: ${REMARK_SITE:-gamereg}
      # A register of one person's playthroughs does not need a moderation
      # team; it needs the owner to be the admin and nobody else.
      ADMIN_SHARED_ID: ${REMARK_ADMIN_ID:-}
      EMOJI: "true"
      # Renamed on the way in. Every other auth variable (AUTH_GITHUB_CID and
      # friends) reaches Remark42 straight through env_file and needs nothing
      # here -- only names generic enough to collide get an entry. This one
      # would sit beside the gateway's own TELEGRAM_BOT_TOKEN in a file both
      # services read, and it is a *different bot*: Telegram allows one
      # consumer per bot, so sharing one would stop the register answering.
      TELEGRAM_TOKEN: ${REMARK_TELEGRAM_TOKEN:-}
    volumes:
      - remark42:/srv/var
    mem_limit: 96m

  # --- profile: tunnel -------------------------------------------------------
  #
  # Whenever something outside this machine has to reach in, with no published
  # port, no static address and no certificate to renew -- which matters on a
  # box whose gateway runs a model with a shell.
  #
  # What it points at is configured in Cloudflare, not here, and both choices
  # are on this network:
  #
  #   remark42:8080    the site is built and served elsewhere, and only the
  #                    comments live here
  #   site-serve:8080  everything is published from this machine through one
  #                    hostname -- and because site-serve already proxies
  #                    /remark42, the comments come along on the same origin,
  #                    which is the arrangement with no cross-origin question
  #                    left in it at all
  #
  # `REMARK_URL` takes a single value, so it names whichever address the
  # browser will actually use. There is no configuration in which both the
  # tunnel hostname and a localhost address work at once.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gamereg-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    mem_limit: 64m

volumes:
  # Only Remark42's, because only Remark42 runs as its own user.
  #
  # Everything else is a bind mount, and not merely because the vault is a git
  # repository somebody pushes. Docker creates a named volume owned by root,
  # and every service here runs with `user:` set to the host's uid so the vault
  # is not left owned by a stranger -- so a named volume is a directory the
  # container cannot write. It shows up as npm failing to create its log
  # directory, which names neither ownership nor volumes.
  remark42:

# Deliberately absent: any mount of /var/run/docker.sock. The gateway runs a
# language model with shell access, and that socket is root on the host. It is
# also why the site profile watches the vault's git HEAD itself rather than
# having the maintenance loop trigger a build through Docker.
